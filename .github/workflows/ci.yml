---
name: SocialPulse Studio Enterprise CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Security Vulnerability Audit
        run: npm audit --audit-level=high

      - name: Validate JavaScript Syntax
        run: |
          node -c src/server.js \
                  src/db.js \
                  src/auth.js \
                  src/logger.js \
                  src/compiler.js \
                  src/crypto.js \
                  src/scheduler.js \
                  src/middleware/auth.js \
                  src/middleware/validate.js \
                  src/validation/schemas.js \
                  src/db/postgres.js \
                  src/queue/circuit-breaker.js \
                  src/platforms/index.js \
                  src/platforms/youtube.js \
                  src/platforms/x.js \
                  src/platforms/linkedin.js \
                  src/media/transcoder.js

      - name: Run Enterprise Test Suite
        run: npm test
        env:
          ENCRYPTION_SECRET: >-
            0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          JWT_SECRET: test_jwt_super_secret_signing_key_for_ci_2026
          NODE_ENV: test
